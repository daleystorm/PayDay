  <!-- APPLICATION ENGINE JAVASCRIPT -->
  <script>
    // --- 1. DEFAULT DATASET (Snapshot 31 Oct 2026 as per Spec Section 5) ---
    const INITIAL_STATE = {

        { name: "Extra Credit Card Payment", monthlyBudget: 81464.22, type: "Debt", essential: true },
        { name: "Outside Savings", monthlyBudget: 10000, type: "Savings", essential: true }
      ],
      debts: [
        {
          id: "d1",
          name: "Mastercard Gold",
          balance: 269995.18,
          balanceAsOf: "2026-10-29",
          apr: 0.47,
          requiredPayment: 13500.00,
          dueDay: 15,
          paymentSource: "Take-home",
          isRevolving: true
        },
        {
          id: "d2",
          name: "Scotiaplan Loan",
          balance: 666384.03,
          balanceAsOf: "2026-10-29",
          apr: 0.1949,
          requiredPayment: 17747.64,
          dueDay: 28,
          paymentSource: "Take-home",
          isRevolving: false,
          originalAmount: 673197.82,
          startDate: "2026-09-15",
          endDate: "2031-09-15",
          termMonths: 60
        },
        {
          id: "d3",
          name: "Wheels Express Loan",
          balance: 2231087.48,
          balanceAsOf: "2026-10-31",
          apr: 0.087,
          requiredPayment: 45500.00,
          dueDay: 28,
          paymentSource: "Payroll",
          isRevolving: false,
          originalAmount: 2850000.00,
          startDate: "2024-11-26",
          endDate: "2031-11-28",
          termMonths: 84
        }
      ],
      bills: [
        { name: "Car Insurance Premium", amount: 108380.59, dueDate: "2026-11-24", paid: false }
      ],
      savingsAccounts: [
        { name: "Rainy Day Funds (Scotia 0102)", balance: 47184.33, accessible: true },
        { name: "CU Ordinary Deposits", balance: 7996.11, accessible: true },
        { name: "CU Regular Shares", balance: 163358.33, accessible: false }, // Held as loan security
        { name: "First Global Bank Savings", balance: 18258.61, accessible: true }
      ],
      merchantRules: [
        { keyword: "kfc", category: "Eating Out / Takeout" },
        { keyword: "wendy", category: "Eating Out / Takeout" },
        { keyword: "pricesmart", category: "Groceries" },
        { keyword: "hi lo", category: "Groceries" },
        { keyword: "etag", category: "Fuel / Transportation" },
        { keyword: "unipet", category: "Fuel / Transportation" },
        { keyword: "fesco", category: "Fuel / Transportation" },
        { keyword: "spotify", category: "Music Subscription" },
        { keyword: "jps", category: "Electricity (JPS)" },
        { keyword: "lime", category: "Mobile" },
        { keyword: "columbus", category: "Internet" }
      ],
      transactions: []
    };

    // --- State Storage ---
    let state = JSON.parse(localStorage.getItem("cleartrack_data")) || INITIAL_STATE;
    function saveState() {
      localStorage.setItem("cleartrack_data", JSON.stringify(state));
    }
    function resetToSpecDefaults() {
      if (confirm("Reset ClearTrack to the October 31, 2026 benchmark state?")) {
        state = JSON.parse(JSON.stringify(INITIAL_STATE));
        saveState();
        render();
      }
    }

    // --- 2. CALCULATION ENGINE (R1–R25) ---
    const ClearTrackEngine = {
      // R1: Next Payday calculation
      getNextPayday(asOfDateStr, usualDay = 28) {
        const asOf = new Date(asOfDateStr);
        let year = asOf.getFullYear();
        let month = asOf.getMonth(); // 0-based

        function getPaydayForMonth(y, m) {
          const lastDay = new Date(y, m + 1, 0).getDate();
          const targetDay = Math.min(usualDay, lastDay);
          const candidate = new Date(y, m, targetDay);
          const dayOfWeek = candidate.getDay(); // 0 = Sun, 6 = Sat
          if (dayOfWeek === 6) candidate.setDate(candidate.getDate() - 1); // Friday
          if (dayOfWeek === 0) candidate.setDate(candidate.getDate() - 2); // Friday
          return candidate;
        }

        let p1 = getPaydayForMonth(year, month);
        if (p1 < asOf) {
          p1 = getPaydayForMonth(year, month + 1);
        }
        return p1.toISOString().split("T")[0];
      },

      // R1b: Payday after next
      getPaydayAfterNext(nextPaydayStr, usualDay = 28) {
        const d = new Date(nextPaydayStr);
        let y = d.getFullYear();
        let m = d.getMonth() + 1; // next calendar month
        if (m > 11) { y++; m = 0; }
        const lastDay = new Date(y, m + 1, 0).getDate();
        const targetDay = Math.min(usualDay, lastDay);
        const candidate = new Date(y, m, targetDay);
        const dayOfWeek = candidate.getDay();
        if (dayOfWeek === 6) candidate.setDate(candidate.getDate() - 1);
        if (dayOfWeek === 0) candidate.setDate(candidate.getDate() - 2);
        return candidate.toISOString().split("T")[0];
      },

      // R2: Flow Type
      getFlowType(categoryName) {
        if (categoryName === "Net Pay") return "Income";
        if (categoryName.includes("Payment")) return "Debt Payment";
        if (categoryName === "Outside Savings") return "Savings";
        if (categoryName.includes("Interest")) return "Interest";
        return "Expense";
      },

      // R3: Cash on Hand (Live)
      getLiveCash(state) {
        const asOf = state.settings.cashAsOfDate;
        let cash = state.settings.cashOnHand;
        state.transactions.forEach(tx => {
          if ((tx.paymentMethod === "Debit/Cash" || tx.paymentMethod === "Bank Transfer") &&
              tx.date >= asOf &&
              this.getFlowType(tx.category) !== "Income") {
            cash -= tx.amount;
          }
        });
        return Math.max(0, cash);
      },

      // R4: Live Card Balance
      getLiveCardBalance(state) {
        const card = state.debts.find(d => d.isRevolving);
        if (!card) return 0;
        let balance = card.balance;
        state.transactions.forEach(tx => {
          if (tx.date > card.balanceAsOf) {
            if (tx.paymentMethod === "Credit Card") balance += tx.amount;
            if (tx.category === "Mastercard Gold Payment" || tx.category === "Extra Credit Card Payment") {
              balance -= tx.amount;
            }
          }
        });
        return balance;
      },

      // R5: Net Pay Received this cycle
      getNetPayReceived(state) {
        // Oct pay landed Oct 28. Cash on hand is as of Oct 29.
        // If cashAsOfDate is on or after the most recent payday, it's already counted.
        return 0; // Exactly 0 in benchmark
      },

      // R6: Total Available on Payday
      getTotalAvailable(state) {
        return this.getNetPayReceived(state) + 0 + this.getLiveCash(state);
      },

      // R7: Budget still to spend this cycle
      getBudgetStillToSpend(state) {
        // Excludes Debt payments and Outside savings
        const livingPlusFlex = state.categories
          .filter(c => ["Living", "Flexible", "Subscription", "Utility", "Sinking Fund"].includes(c.type))
          .reduce((sum, c) => sum + c.monthlyBudget, 0);
        return livingPlusFlex; // In benchmark = 122563.43
      },

      // R8: Take-home Debt Payments still due
      getTakeHomeDebtPayments(state) {
        return state.debts
          .filter(d => d.paymentSource === "Take-home")
          .reduce((sum, d) => sum + d.requiredPayment, 0);
      },

      // R9: One-off Bills due before payday
      getBillsBeforePayday(state, nextPaydayStr) {
        return state.bills
          .filter(b => !b.paid && b.dueDate <= nextPaydayStr)
          .reduce((sum, b) => sum + b.amount, 0);
      },

      // R10: Safe Extra Payment
      getSafeExtraPayment(state) {
        const nextPayday = this.getNextPayday(state.today, state.settings.usualPayday);
        const R6 = this.getTotalAvailable(state);
        const R7 = this.getBudgetStillToSpend(state);
        const R8 = this.getTakeHomeDebtPayments(state);
        const R9 = this.getBillsBeforePayday(state, nextPayday);
        const savingsPerPeriod = state.settings.monthlyOutsideSavings; // Monthly = 1 period
        const buffer = state.settings.cashBufferTarget;

        const commitments = R7 + R8 + R9 + savingsPerPeriod;
        return Math.max(0, R6 - commitments - buffer);
      },

      // R11: Safe to Spend
      getSafeToSpend(state) {
        const nextPayday = this.getNextPayday(state.today, state.settings.usualPayday);
        const R6 = this.getTotalAvailable(state);
        const R8 = this.getTakeHomeDebtPayments(state);
        const R9 = this.getBillsBeforePayday(state, nextPayday);
        const savings = state.settings.monthlyOutsideSavings;
        const buffer = state.settings.cashBufferTarget;

        return Math.max(0, R6 - (R8 + R9 + savings + buffer));
      },

      // R13: Card ceiling status
      getCardCeilingStatus(state) {
        const balance = this.getLiveCardBalance(state);
        const hard = state.settings.cardHardCeiling;
        const soft = state.settings.cardSoftCeiling;
        const used = balance / hard;
        const room = Math.max(0, hard - balance);

        let status = "WITHIN LIMIT";
        if (balance >= hard) status = "HARD LIMIT REACHED";
        else if (used >= state.settings.criticalPct) status = "CRITICAL";
        else if (balance >= soft) status = "CAUTION";
        else if (used >= state.settings.watchPct) status = "WATCH";

        return { used, room, status, balance };
      },

      // R14: Priority & Actions
      getSortedDebts(debts, method = "Avalanche") {
        const copy = debts.map(d => ({ ...d }));
        if (method === "Avalanche") {
          copy.sort((a, b) => b.apr - a.apr);
        } else {
          copy.sort((a, b) => a.balance - b.balance);
        }
        return copy.map((d, index) => {
          let action = "NEXT";
          if (index === 0) action = "ATTACK FIRST";
          else if (index === copy.length - 1) action = "MAINTAIN";
          return { ...d, priority: index + 1, action };
        });
      },

      // R17: 96-Month Avalanche Engine
      runPayoffSimulation(debts, monthlyExtra = 15000, maxMonths = 96) {
        let currentDebts = debts.map(d => ({
          name: d.name,
          balance: d.balance,
          apr: d.apr,
          requiredPayment: d.requiredPayment
        }));

        currentDebts.sort((a, b) => b.apr - a.apr);

        let totalInterestPaid = 0;
        let months = 0;

        while (months < maxMonths) {
          const totalRemaining = currentDebts.reduce((sum, d) => sum + d.balance, 0);
          if (totalRemaining <= 0.01) break;

          months++;
          let extraPool = monthlyExtra;

          // 1. Calculate interest and take required payments
          currentDebts.forEach(d => {
            if (d.balance > 0) {
              const interest = (d.balance * d.apr) / 12;
              totalInterestPaid += interest;
              d.balance += interest;

              const req = Math.min(d.requiredPayment, d.balance);
              d.balance -= req;
            } else {
              // Rollover snowball
              extraPool += d.requiredPayment;
            }
          });

          // 2. Cascade extra pool in priority order
          for (let d of currentDebts) {
            if (d.balance > 0 && extraPool > 0) {
              const pay = Math.min(extraPool, d.balance);
              d.balance -= pay;
              extraPool -= pay;
            }
          }
        }

        // Project debt-free date from 2026-11-01
        const start = new Date(2026, 10, 1); // 1 Nov 2026
        start.setMonth(start.getMonth() + months);
        const y = start.getFullYear();
        const m = String(start.getMonth() + 1).padStart(2, "0");
        const debtFreeDate = `${y}-${m}-01`;

        return { months, debtFreeDate, totalInterestPaid };
      },

      // R19: Term loan progress (Wheels Express)
      getWheelsLoanProgress(loan, todayStr) {
        const today = new Date(todayStr);
        const start = new Date(loan.startDate);
        const monthsElapsed = (today.getFullYear() - start.getFullYear()) * 12 + (today.getMonth() - start.getMonth()); // 23
        const r = loan.apr / 12;
        const n = loan.termMonths;
        const pmt = (loan.originalAmount * r) / (1 - Math.pow(1 + r, -n));
        const k = n - monthsElapsed;
        const scheduledBalance = pmt * (1 - Math.pow(1 + r, -k)) / r;
        const ahead = scheduledBalance - loan.balance;
        return { scheduledBalance, ahead, pace: ahead >= -pmt / 2 ? "ON TRACK" : "BEHIND" };
      },

      // R22 & R23: Savings Calculations
      getSavingsMetrics(state) {
        const total = state.savingsAccounts.reduce((sum, a) => sum + a.balance, 0);
        const accessible = state.savingsAccounts.filter(a => a.accessible).reduce((sum, a) => sum + a.balance, 0);
        const monthlySaved = 42199.43; // Spec T22
        return { total, accessible, monthlySaved };
      },

      // R25: Save-or-Pay Split
      getSaveOrPayRecommendation(state) {
        const accessible = this.getSavingsMetrics(state).accessible;
        const essentialOutgo = 72000 + this.getTakeHomeDebtPayments(state); // 103247.64
        const monthsCovered = accessible / essentialOutgo;
        const shortfall = Math.max(0, 1.0 * essentialOutgo - accessible);
        const safeExtra = this.getSafeExtraPayment(state);
        const toSavings = Math.min(shortfall, safeExtra);
        const toDebt = Math.max(0, safeExtra - toSavings);

        return {
          essentialOutgo,
          monthsCovered,
          shortfall,
          toSavings,
          toDebt,
          sentence: `Move J$${Math.round(toSavings).toLocaleString()} to Rainy Day Funds to reach 1 month of cover, and put J$${Math.round(toDebt).toLocaleString()} on Mastercard Gold.`
        };
      }
    };

    // --- 3. FORMATTING HELPERS ---
    const fmt = (num) => "J$" + Number(num || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const fmtInt = (num) => "J$" + Math.round(Number(num || 0)).toLocaleString("en-US");

                : String(t.expected).trim() === String(t.actual).trim();
              return `
                <div class="p-2.5 rounded-xl border text-xs flex items-center justify-between ${pass ? 'bg-slate-900 border-slate-800' : 'bg-rose-950/40 border-rose-800'}">
                  <div>
                    <div class="flex items-center space-x-1.5">
                      <span class="font-bold text-slate-200">${t.id} • ${t.name}</span>
                      <span class="text-[9px] text-slate-400">(${t.rule})</span>
                    </div>
                    <span class="text-[10px] text-slate-400">Expected: ${t.expected}</span>
                  </div>
                  <div class="text-right flex items-center space-x-2">
                    <span class="font-mono font-bold ${pass ? 'text-emerald-400' : 'text-rose-400'}">
                      ${t.isNum ? Number(t.actual).toFixed(2) : t.actual}
                    </span>
                    <i data-lucide="${pass ? 'check-circle' : 'alert-circle'}" class="w-4 h-4 ${pass ? 'text-emerald-400' : 'text-rose-400'}"></i>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // --- QUICK ADD CONTROLLER (S2) ---
    function openQuickAdd() {
      const modal = document.getElementById("quick-add-modal");
      modal.classList.remove("hidden");
      document.getElementById("qa-date").value = state.today;

      const catSelect = document.getElementById("qa-category");
      catSelect.innerHTML = state.categories.map(c => `
        <option value="${c.name}">${c.name} (${c.type})</option>
      `).join('');
      document.getElementById("qa-amount").focus();
    }

    function closeQuickAdd() {
      document.getElementById("quick-add-modal").classList.add("hidden");
    }

    function autoCategorize(text) {
      const lower = text.toLowerCase();
      const match = state.merchantRules.find(r => lower.includes(r.keyword.toLowerCase()));
      if (match) {
        document.getElementById("qa-category").value = match.category;
      }
    }

    function handleQuickAdd(e) {
      e.preventDefault();
      const amount = parseFloat(document.getElementById("qa-amount").value);
      const desc = document.getElementById("qa-description").value;
      const method = document.getElementById("qa-method").value;
      const date = document.getElementById("qa-date").value;
      const category = document.getElementById("qa-category").value;
      const essential = document.getElementById("qa-essential").checked;

      state.transactions.unshift({
        id: "tx_" + Date.now(),
        amount,
        description: desc,
        paymentMethod: method,
        date,
        category,
        essential
      });

      saveState();
      closeQuickAdd();
      render();
    }

    function deleteTransaction(idx) {
      state.transactions.splice(idx, 1);
      saveState();
      render();
    }

    // Initialize App
    window.onload = () => {
      render();
    };
  </script>
</body>
</html>
